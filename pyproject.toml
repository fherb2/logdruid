[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "logdruid"
version = "0.1.0.dev3"
description = "A drop-in logging setup layer for multi-process applications, built on loguru."
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "github.com/fherb2" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "loguru>=0.7.3",
]

[project.urls]
Documentation = "https://fherb2.github.io/logdruid/"
Repository = "https://github.com/fherb2/logdruid"
Issues = "https://github.com/fherb2/logdruid/issues"
Changelog = "https://fherb2.github.io/logdruid/changelog/"

[tool.poetry]
packages = [{ include = "logdruid", from = "src" }]

[tool.poetry.group.dev.dependencies]
tox = "^4.0"
tox-gh = "^1.0"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6"
mkdocs-material = "^9.5"
mkdocstrings = { version = ">=0.27", extras = ["python"] }
