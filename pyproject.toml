[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "logdruid"
version = "0.1.0.dev1"
description = "A drop-in logging setup layer for multi-process applications, built on loguru."
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "github.com/fherb2" },
]
dependencies = [
    "loguru>=0.7.3",
]

[tool.poetry]
packages = [{ include = "logdruid", from = "src" }]

[tool.poetry.group.dev.dependencies]
tox = "^4.0"
tox-gh = "^1.0"
