site_name: logdruid
site_description: A drop-in logging setup layer for multi-process applications, built on loguru.
repo_url: https://github.com/fherb2/logdruid
repo_name: fherb2/logdruid

theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - How it works: how-it-works.md
  - Integration: integration.md
  - Configuration: configuration.md
  - Libraries using logging: libraries.md
  - Exceptions and crashes: exceptions.md
  - Known limitations: limitations.md
  - API reference: api.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true
            show_if_no_docstring: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path:
        - "."
      check_paths: true
